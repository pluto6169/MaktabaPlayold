<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الملف الشخصي – MaktabaPlay</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/style.css">
    <style>
        .profile-container {
            max-width: 1000px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .profile-header {
            background: linear-gradient(145deg, #0f1a2f, #0b1220);
            border: 1px solid var(--border);
            border-radius: 24px;
            padding: 40px;
            display: flex;
            align-items: center;
            gap: 30px;
            margin-bottom: 30px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.3);
        }

        .profile-avatar-large {
            width: 120px;
            height: 120px;
            background: linear-gradient(135deg, var(--brand), var(--brand-2));
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 50px;
            font-weight: 800;
            color: #000;
            box-shadow: 0 10px 20px rgba(6, 182, 212, 0.3);
        }

        .profile-info h1 {
            font-size: 36px;
            margin-bottom: 10px;
            color: white;
        }

        .profile-info p {
            color: var(--muted);
            font-size: 16px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: rgba(15, 26, 47, 0.5);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 20px;
            text-align: center;
            backdrop-filter: blur(10px);
        }

        .stat-card h3 {
            font-size: 14px;
            color: var(--muted);
            margin-bottom: 10px;
        }

        .stat-card .val {
            font-size: 32px;
            font-weight: 800;
            color: var(--brand-2);
        }

        .badges-section, .scores-section {
            background: #0b1220;
            border: 1px solid var(--border);
            border-radius: 24px;
            padding: 30px;
            margin-bottom: 30px;
        }

        .section-title {
            font-size: 24px;
            color: white;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .badges-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
        }

        .badge-item {
            background: linear-gradient(135deg, rgba(34, 197, 94, 0.1), rgba(6, 182, 212, 0.1));
            border: 1px solid rgba(6, 182, 212, 0.3);
            padding: 10px 20px;
            border-radius: 30px;
            font-weight: bold;
            color: #a5f3fc;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .badge-locked {
            filter: grayscale(1);
            opacity: 0.5;
            border-style: dashed;
        }

        .scores-table {
            width: 100%;
            border-collapse: collapse;
        }

        .scores-table th, .scores-table td {
            padding: 12px;
            text-align: right;
            border-bottom: 1px solid var(--border);
        }

        .scores-table th {
            color: var(--muted);
        }

        .scores-table tr:last-child td {
            border-bottom: none;
        }

        @media (max-width: 768px) {
            .profile-header {
                flex-direction: column;
                text-align: center;
            }
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <div class="brand">
                <div class="brand-badge">مـ</div>
                <span>MaktabaPlay</span>
            </div>
            <div class="nav-links">
                <a href="index.html">الرئيسية</a>
                <a href="about.html">من نحن</a>
                <a href="contact.html">تواصل</a>
                <a href="partners.html">شركاء</a>
            </div>
            <div id="authLinks" style="display: flex; gap: 10px; align-items: center;"></div>
        </div>
    </nav>

    <div class="profile-container" id="profileContent" style="display: none;">
        <div class="profile-header">
            <div class="profile-avatar-large" id="avatarChar">أ</div>
            <div class="profile-info">
                <h1 id="profUsername">اسم المستخدم</h1>
                <p>📧 <span id="profEmail">email@example.com</span></p>
                <p style="margin-top: 5px;">📅 تاريخ الانضمام: <span id="profDate">2026</span></p>
            </div>
        </div>

        <div class="stats-grid">
            <div class="stat-card">
                <h3>إجمالي النقاط ⭐</h3>
                <div class="val" id="profTotalScore">0</div>
            </div>
            <div class="stat-card">
                <h3>الألعاب الملعوبة 🎮</h3>
                <div class="val" id="profGamesPlayed">0</div>
            </div>
            <div class="stat-card">
                <h3>الشارات المكتسبة 🏆</h3>
                <div class="val" id="profBadgesCount">0</div>
            </div>
        </div>

        <div class="badges-section">
            <h2 class="section-title">🎖️ شارات الإنجاز</h2>
            <div class="badges-grid" id="badgesList">
                <!-- سيتم ملؤه بواسطة JS -->
            </div>
        </div>

        <div class="scores-section">
            <h2 class="section-title">📈 أعلى النقاط في الألعاب</h2>
            <table class="scores-table">
                <thead>
                    <tr>
                        <th>اللعبة</th>
                        <th>أعلى نقاط</th>
                    </tr>
                </thead>
                <tbody id="scoresTableBody">
                    <!-- سيتم ملؤه بواسطة JS -->
                </tbody>
            </table>
        </div>
    </div>

    <div class="profile-container" id="loginPrompt" style="text-align: center; margin-top: 100px;">
        <h2 style="color: white; margin-bottom: 20px;">يجب تسجيل الدخول لعرض الملف الشخصي</h2>
        <button class="btn btn-primary" onclick="showAuthModal('login')">تسجيل الدخول</button>
    </div>

    <script src="assets/auth.js"></script>
    <script>
        const GAME_NAMES = {
            'hangman': 'هانج مان المخطوط',
            'ladder': 'السلم والتصنيف',
            'detective': 'محقق الكتب',
            'sorter': 'رتّب الرف',
            'quiz': 'كويز المكتبات',
            'match': 'وصّل المفاهيم',
            'memory': 'ذاكرة الفهرسة',
            'race': 'سباق التصنيف'
        };

        const ALL_BADGES = ['🌟 المبتدئ', '🏆 المصنّف', '🧠 الحافظ', '📚 المكتبي', '🔥 السلسلة'];

        document.addEventListener('DOMContentLoaded', async () => {
            const user = await window.maktabaAuth.refreshUser();

            if (user) {
                document.getElementById('loginPrompt').style.display = 'none';
                document.getElementById('profileContent').style.display = 'block';

                // Populate Header
                document.getElementById('avatarChar').innerText = user.username.charAt(0).toUpperCase();
                document.getElementById('profUsername').innerText = user.username;
                document.getElementById('profEmail').innerText = user.email;
                document.getElementById('profDate').innerText = new Date(user.joinedAt).toLocaleDateString('ar-EG');

                // Populate Stats
                document.getElementById('profTotalScore').innerText = user.stats.totalScore;
                document.getElementById('profGamesPlayed').innerText = user.stats.gamesPlayed;
                document.getElementById('profBadgesCount').innerText = user.stats.badges.length;

                // Populate Badges
                const badgesHtml = ALL_BADGES.map(badge => {
                    const isUnlocked = user.stats.badges.includes(badge);
                    return `<div class="badge-item ${isUnlocked ? '' : 'badge-locked'}">${badge}</div>`;
                }).join('');
                document.getElementById('badgesList').innerHTML = badgesHtml;

                // Populate Scores
                const scoresHtml = Object.keys(user.gameScores).map(gameId => {
                    return `
                        <tr>
                            <td style="font-weight: bold; color: white;">${GAME_NAMES[gameId]}</td>
                            <td style="color: var(--accent2); font-weight: bold;">${user.gameScores[gameId]}</td>
                        </tr>
                    `;
                }).join('');
                document.getElementById('scoresTableBody').innerHTML = scoresHtml;

            } else {
                document.getElementById('loginPrompt').style.display = 'block';
                document.getElementById('profileContent').style.display = 'none';
            }
        });
    </script>
</body>
</html>
