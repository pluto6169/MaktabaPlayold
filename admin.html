<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم – MaktabaPlay</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/style.css">
    <style>
        .admin-container {
            max-width: 1200px;
            margin: 40px auto;
            padding: 20px;
        }
        .admin-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }
        .admin-table {
            width: 100%;
            border-collapse: collapse;
            background: #0e1626;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .admin-table th, .admin-table td {
            padding: 15px;
            text-align: right;
            border-bottom: 1px solid var(--border);
        }
        .admin-table th {
            background: rgba(6, 182, 212, 0.1);
            color: #a5f3fc;
            font-weight: 800;
        }
        .admin-table tr:hover {
            background: rgba(255,255,255,0.02);
        }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        .stat-card {
            background: #0e1626;
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 20px;
            text-align: center;
        }
        .stat-val {
            font-size: 32px;
            font-weight: 800;
            color: var(--brand-2);
            margin-bottom: 5px;
        }
        .stat-lbl {
            color: var(--muted);
            font-size: 14px;
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <div class="brand">
                <div class="brand-badge">مـ</div>
                <span>MaktabaPlay Admin</span>
            </div>
            <div class="nav-links">
                <a href="index.html">العودة للمنصة</a>
            </div>
        </div>
    </nav>

    <div class="admin-container">
        <div class="admin-header">
            <h2>👥 لوحة إدارة المستخدمين</h2>
            <button class="btn btn-primary" onclick="exportToCSV()">📥 تصدير كـ CSV (Excel)</button>
        </div>

        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-val" id="totalUsers">0</div>
                <div class="stat-lbl">إجمالي المسجلين</div>
            </div>
            <div class="stat-card">
                <div class="stat-val" id="totalGames">0</div>
                <div class="stat-lbl">إجمالي الألعاب الملعوبة</div>
            </div>
        </div>

        <table class="admin-table">
            <thead>
                <tr>
                    <th>اسم المستخدم</th>
                    <th>البريد الإلكتروني</th>
                    <th>تاريخ التسجيل</th>
                    <th>النقاط</th>
                    <th>جولات اللعب</th>
                </tr>
            </thead>
            <tbody id="usersTableBody">
                <tr><td colspan="5" style="text-align:center;">جاري تحميل البيانات...</td></tr>
            </tbody>
        </table>
    </div>

    <script>
        let usersData = [];

        async function fetchUsers() {
            try {
                const response = await fetch('/api/admin/users');
                const data = await response.json();
                
                if (data.success) {
                    usersData = data.users;
                    renderUsers();
                } else {
                    document.getElementById('usersTableBody').innerHTML = '<tr><td colspan="5" style="text-align:center; color:red;">خطأ في جلب البيانات</td></tr>';
                }
            } catch (error) {
                console.error(error);
                document.getElementById('usersTableBody').innerHTML = '<tr><td colspan="5" style="text-align:center; color:red;">خطأ في الاتصال بالخادم</td></tr>';
            }
        }

        function renderUsers() {
            const tbody = document.getElementById('usersTableBody');
            let totalGames = 0;
            
            if (usersData.length === 0) {
                tbody.innerHTML = '<tr><td colspan="5" style="text-align:center;">لا يوجد مستخدمين مسجلين بعد</td></tr>';
                return;
            }

            const rows = usersData.map(user => {
                totalGames += user.gamesPlayed;
                return `
                    <tr>
                        <td style="font-weight:bold; color:white;">${user.username}</td>
                        <td style="color:var(--muted);">${user.email}</td>
                        <td>${new Date(user.joinedAt).toLocaleDateString('ar-EG')}</td>
                        <td style="color:var(--accent2); font-weight:bold;">${user.totalScore}</td>
                        <td>${user.gamesPlayed}</td>
                    </tr>
                `;
            }).join('');

            tbody.innerHTML = rows;
            document.getElementById('totalUsers').innerText = usersData.length;
            document.getElementById('totalGames').innerText = totalGames;
        }

        function exportToCSV() {
            if (usersData.length === 0) {
                alert('لا توجد بيانات للتصدير');
                return;
            }

            const headers = ['اسم المستخدم', 'البريد الإلكتروني', 'تاريخ التسجيل', 'النقاط الإجمالية', 'جولات اللعب'];
            const csvRows = [];
            
            // Add BOM for Excel Arabic support
            csvRows.push('\uFEFF' + headers.join(','));

            usersData.forEach(user => {
                const row = [
                    user.username,
                    user.email,
                    new Date(user.joinedAt).toLocaleDateString('ar-EG'),
                    user.totalScore,
                    user.gamesPlayed
                ];
                csvRows.push(row.join(','));
            });

            const csvString = csvRows.join('\n');
            const blob = new Blob([csvString], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            
            const link = document.createElement('a');
            link.setAttribute('href', url);
            link.setAttribute('download', 'maktaba_users_export.csv');
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        document.addEventListener('DOMContentLoaded', fetchUsers);
    </script>
</body>
</html>
