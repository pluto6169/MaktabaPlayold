<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة تحكم المسؤول - MaktabaPlay</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 10px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 2em;
            margin-bottom: 10px;
        }

        .header p {
            opacity: 0.9;
        }

        .nav {
            display: flex;
            gap: 10px;
            padding: 20px;
            border-bottom: 1px solid #eee;
            flex-wrap: wrap;
        }

        .nav button {
            padding: 10px 20px;
            border: none;
            background: #f0f0f0;
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 14px;
        }

        .nav button.active {
            background: #667eea;
            color: white;
        }

        .nav button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }

        .content {
            padding: 30px;
        }

        .section {
            display: none;
        }

        .section.active {
            display: block;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
        }

        .stat-card h3 {
            font-size: 14px;
            opacity: 0.9;
            margin-bottom: 10px;
        }

        .stat-card .value {
            font-size: 32px;
            font-weight: bold;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        table th {
            background: #f5f5f5;
            padding: 15px;
            text-align: right;
            font-weight: 600;
            border-bottom: 2px solid #667eea;
        }

        table td {
            padding: 12px 15px;
            border-bottom: 1px solid #eee;
        }

        table tr:hover {
            background: #f9f9f9;
        }

        .actions {
            display: flex;
            gap: 10px;
        }

        .btn {
            padding: 8px 15px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 12px;
        }

        .btn-primary {
            background: #667eea;
            color: white;
        }

        .btn-danger {
            background: #f56565;
            color: white;
        }

        .btn-success {
            background: #48bb78;
            color: white;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #333;
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 14px;
        }

        .form-group textarea {
            resize: vertical;
            min-height: 100px;
        }

        .alert {
            padding: 15px;
            border-radius: 5px;
            margin-bottom: 20px;
            animation: slideIn 0.3s ease;
        }

        .alert-success {
            background: #c6f6d5;
            color: #22543d;
            border-left: 4px solid #48bb78;
        }

        .alert-error {
            background: #fed7d7;
            color: #742a2a;
            border-left: 4px solid #f56565;
        }

        .alert-info {
            background: #bee3f8;
            color: #2c5282;
            border-left: 4px solid #667eea;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .loading {
            text-align: center;
            padding: 20px;
            color: #667eea;
        }

        .logout-btn {
            margin: 0 10px;
            background: #f56565;
        }

        .user-info {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(255, 255, 255, 0.1);
            color: white;
            padding: 10px 20px;
            border-radius: 5px;
            font-size: 14px;
        }

        .search-box {
            margin-bottom: 20px;
            display: flex;
            gap: 10px;
        }

        .search-box input {
            flex: 1;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
        }

        .pagination {
            margin-top: 20px;
            display: flex;
            gap: 10px;
            justify-content: center;
        }

        .pagination button {
            padding: 8px 15px;
            border: 1px solid #667eea;
            background: white;
            color: #667eea;
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .pagination button.active {
            background: #667eea;
            color: white;
        }

        .pagination button:hover {
            transform: translateY(-2px);
        }

        @media (max-width: 768px) {
            .nav {
                flex-direction: column;
            }

            .nav button {
                width: 100%;
            }

            .stats {
                grid-template-columns: 1fr;
            }

            table {
                font-size: 12px;
            }

            table th, table td {
                padding: 8px;
            }
        }
    </style>
</head>
<body>
    <div class="user-info">
        <span id="currentUser">مستخدم</span>
        <button class="btn logout-btn" onclick="logout()">تسجيل الخروج</button>
    </div>

    <div class="container">
        <div class="header">
            <h1>🎮 لوحة تحكم المسؤول</h1>
            <p>MaktabaPlay Administration Panel</p>
        </div>

        <div class="nav">
            <button class="nav-btn active" data-section="dashboard">📊 لوحة التحكم</button>
            <button class="nav-btn" data-section="users">👥 المستخدمون</button>
            <button class="nav-btn" data-section="statistics">📈 الإحصائيات</button>
            <button class="nav-btn" data-section="backup">💾 النسخ الاحتياطية</button>
            <button class="nav-btn" data-section="audit">📋 سجل الأنشطة</button>
        </div>

        <div class="content">
            <div id="alerts"></div>

            <!-- Dashboard Section -->
            <div id="dashboard" class="section active">
                <h2>📊 ملخص النظام</h2>
                <div id="statsContainer" class="stats">
                    <div class="loading">جاري التحميل...</div>
                </div>
            </div>

            <!-- Users Section -->
            <div id="users" class="section">
                <h2>👥 إدارة المستخدمين</h2>
                <div class="search-box">
                    <input type="text" id="userSearch" placeholder="البحث عن مستخدم...">
                    <button class="btn btn-primary" onclick="refreshUsers()">🔄 تحديث</button>
                </div>
                <div id="usersContainer"></div>
            </div>

            <!-- Statistics Section -->
            <div id="statistics" class="section">
                <h2>📈 الإحصائيات التفصيلية</h2>
                <div id="statsDetails"></div>
            </div>

            <!-- Backup Section -->
            <div id="backup" class="section">
                <h2>💾 إدارة النسخ الاحتياطية</h2>
                <button class="btn btn-success" onclick="createBackup()">📥 إنشاء نسخة احتياطية</button>
                <div id="backupContainer"></div>
            </div>

            <!-- Audit Log Section -->
            <div id="audit" class="section">
                <h2>📋 سجل الأنشطة</h2>
                <div class="search-box">
                    <select id="actionFilter" onchange="refreshAuditLog()">
                        <option value="">جميع الأنشطة</option>
                        <option value="USER_CREATED">إنشاء مستخدم</option>
                        <option value="USER_DELETED">حذف مستخدم</option>
                        <option value="USER_UPDATED">تحديث مستخدم</option>
                        <option value="SCORES_RESET">إعادة تعيين النقاط</option>
                        <option value="DATA_EXPORTED">تصدير البيانات</option>
                    </select>
                    <button class="btn btn-primary" onclick="refreshAuditLog()">🔄 تحديث</button>
                </div>
                <div id="auditContainer"></div>
            </div>
        </div>
    </div>

    <script>
        let token = localStorage.getItem('authToken');
        let currentUser = localStorage.getItem('currentUser');

        if (!token) {
            window.location.href = '/login';
        }

        // Display current user
        if (currentUser) {
            const user = JSON.parse(currentUser);
            document.getElementById('currentUser').textContent = `مرحباً ${user.username}`;
        }

        // Navigation
        document.querySelectorAll('.nav-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                const section = this.dataset.section;
                document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
                document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
                this.classList.add('active');
                document.getElementById(section).classList.add('active');

                if (section === 'dashboard') loadStats();
                if (section === 'users') refreshUsers();
                if (section === 'statistics') loadDetailedStats();
                if (section === 'backup') loadBackups();
                if (section === 'audit') refreshAuditLog();
            });
        });

        // Load initial stats
        loadStats();

        async function apiCall(endpoint, method = 'GET', body = null) {
            const headers = {
                'Authorization': `Bearer ${token}`,
                'Content-Type': 'application/json'
            };

            try {
                const options = { method, headers };
                if (body) options.body = JSON.stringify(body);

                const response = await fetch(endpoint, options);
                const data = await response.json();

                if (response.status === 401 || response.status === 403) {
                    logout();
                    return null;
                }

                return data;
            } catch (error) {
                showAlert(`خطأ: ${error.message}`, 'error');
                return null;
            }
        }

        function showAlert(message, type = 'info') {
            const alertDiv = document.createElement('div');
            alertDiv.className = `alert alert-${type}`;
            alertDiv.textContent = message;
            document.getElementById('alerts').appendChild(alertDiv);

            setTimeout(() => alertDiv.remove(), 5000);
        }

        async function loadStats() {
            const data = await apiCall('/api/admin/stats');
            if (data && data.success) {
                const stats = data.stats;
                document.getElementById('statsContainer').innerHTML = `
                    <div class="stat-card">
                        <h3>إجمالي المستخدمين</h3>
                        <div class="value">${stats.totalUsers}</div>
                    </div>
                    <div class="stat-card">
                        <h3>إجمالي النقاط</h3>
                        <div class="value">${stats.totalScores || 0}</div>
                    </div>
                    <div class="stat-card">
                        <h3>متوسط الألعاب الممارسة</h3>
                        <div class="value">${stats.avgGamesPlayed}</div>
                    </div>
                `;
            }
        }

        async function refreshUsers() {
            const data = await apiCall('/api/admin/users');
            if (data && data.success) {
                const users = data.users;
                const searchTerm = document.getElementById('userSearch')?.value || '';

                const filtered = users.filter(u =>
                    u.username.includes(searchTerm) ||
                    u.email.includes(searchTerm)
                );

                let html = `
                    <table>
                        <tr>
                            <th>اسم المستخدم</th>
                            <th>البريد الإلكتروني</th>
                            <th>النقاط</th>
                            <th>الألعاب</th>
                            <th>آخر دخول</th>
                            <th>الإجراءات</th>
                        </tr>
                `;

                filtered.forEach(user => {
                    html += `
                        <tr>
                            <td>${user.username}</td>
                            <td>${user.email}</td>
                            <td>${user.totalScore}</td>
                            <td>${user.gamesPlayed}</td>
                            <td>${new Date(user.lastLogin || 'N/A').toLocaleString('ar-SA')}</td>
                            <td>
                                <div class="actions">
                                    <button class="btn btn-primary" onclick="editUser('${user.username}')">✏️ تعديل</button>
                                    <button class="btn btn-danger" onclick="deleteUser('${user.username}')">🗑️ حذف</button>
                                    <button class="btn btn-success" onclick="resetScores('${user.username}')">🔄 إعادة تعيين</button>
                                </div>
                            </td>
                        </tr>
                    `;
                });

                html += '</table>';
                document.getElementById('usersContainer').innerHTML = html;
            }
        }

        async function deleteUser(username) {
            if (confirm(`هل أنت متأكد من حذف ${username}؟`)) {
                const data = await apiCall(`/api/admin/users/${username}`, 'DELETE');
                if (data && data.success) {
                    showAlert('تم حذف المستخدم بنجاح', 'success');
                    refreshUsers();
                } else {
                    showAlert(data?.message || 'خطأ في الحذف', 'error');
                }
            }
        }

        async function resetScores(username) {
            if (confirm(`هل تريد إعادة تعيين نقاط ${username}؟`)) {
                const data = await apiCall(`/api/admin/users/${username}/reset-scores`, 'POST');
                if (data && data.success) {
                    showAlert('تم إعادة تعيين النقاط بنجاح', 'success');
                    refreshUsers();
                }
            }
        }

        async function loadDetailedStats() {
            const data = await apiCall('/api/admin/stats');
            if (data && data.success) {
                const stats = data.stats;
                let html = '<h3>أفضل اللاعبين</h3><table><tr><th>الترتيب</th><th>اسم المستخدم</th><th>النقاط</th><th>الألعاب</th></tr>';

                stats.topPlayers.forEach((player, i) => {
                    html += `<tr><td>${i + 1}</td><td>${player.username}</td><td>${player.totalScore}</td><td>${player.gamesPlayed}</td></tr>`;
                });

                html += '</table>';
                document.getElementById('statsDetails').innerHTML = html;
            }
        }

        async function createBackup() {
            const data = await apiCall('/api/admin/backup', 'POST');
            if (data && data.success) {
                showAlert(`تم إنشاء نسخة احتياطية (${data.userCount} مستخدم)`, 'success');
                loadBackups();
            }
        }

        async function loadBackups() {
            const data = await apiCall('/api/admin/backups');
            if (data && data.success) {
                const backups = data.backups;
                let html = '<table><tr><th>الملف</th><th>الحجم</th><th>التاريخ</th></tr>';

                backups.forEach(backup => {
                    html += `
                        <tr>
                            <td>${backup.filename}</td>
                            <td>${(backup.size / 1024).toFixed(2)} KB</td>
                            <td>${new Date(backup.created).toLocaleString('ar-SA')}</td>
                        </tr>
                    `;
                });

                html += '</table>';
                document.getElementById('backupContainer').innerHTML = html;
            }
        }

        async function refreshAuditLog() {
            const data = await apiCall('/api/admin/audit-log?limit=50');
            if (data && data.success) {
                const logs = data.logs;
                let html = '<table><tr><th>المستخدم</th><th>الإجراء</th><th>التفاصيل</th><th>التاريخ</th></tr>';

                logs.forEach(log => {
                    html += `
                        <tr>
                            <td>${log.username || 'نظام'}</td>
                            <td>${log.action}</td>
                            <td>${log.details || '-'}</td>
                            <td>${new Date(log.timestamp).toLocaleString('ar-SA')}</td>
                        </tr>
                    `;
                });

                html += '</table>';
                document.getElementById('auditContainer').innerHTML = html;
            }
        }

        function logout() {
            localStorage.removeItem('authToken');
            localStorage.removeItem('currentUser');
            window.location.href = '/login';
        }

        // Search functionality
        document.getElementById('userSearch')?.addEventListener('input', refreshUsers);
    </script>
</body>
</html>
